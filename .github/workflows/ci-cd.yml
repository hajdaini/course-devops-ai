name: CI CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version:
          - 22
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Create test report
        run: |
          mkdir -p dist
          printf "lint=passed\ntest=passed\nsha=%s\n" "${GITHUB_SHA}" > dist/quality-report.txt

      - name: Upload quality report
        uses: actions/upload-artifact@v4
        with:
          name: quality-report
          path: dist/quality-report.txt

  docker:
    name: Docker
    runs-on: ubuntu-latest
    needs:
      - quality
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=
            type=ref,event=branch

      - name: Login to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-dev:
    name: Deploy dev
    runs-on: ubuntu-latest
    needs:
      - docker
    if: github.event_name == 'push'
    environment:
      name: dev
    steps:
      - name: Create deployment manifest
        run: |
          mkdir -p deploy
          printf "environment=dev\nimage=%s/%s:%s\nsha=%s\n" "${REGISTRY}" "${IMAGE_NAME}" "${GITHUB_SHA}" "${GITHUB_SHA}" > deploy/dev.env

      - name: Upload deployment manifest
        uses: actions/upload-artifact@v4
        with:
          name: deploy-dev
          path: deploy/dev.env

  deploy-prod:
    name: Deploy prod
    runs-on: ubuntu-latest
    needs:
      - deploy-dev
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment:
      name: prod
    steps:
      - name: Create production manifest
        run: |
          mkdir -p deploy
          printf "environment=prod\nimage=%s/%s:%s\nsha=%s\nrollback=use-previous-ghcr-tag\n" "${REGISTRY}" "${IMAGE_NAME}" "${GITHUB_SHA}" "${GITHUB_SHA}" > deploy/prod.env

      - name: Upload production manifest
        uses: actions/upload-artifact@v4
        with:
          name: deploy-prod
          path: deploy/prod.env